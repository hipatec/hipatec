
spring.application.name=hipatec

# Carrega o .env da raiz do projeto
spring.config.import=optional:file:${user.dir}/.env[.properties]

# Perfil padrão
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Banco de dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# E-mail
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hipatec.mail.from=${HIPATEC_MAIL_FROM:nao-responda@hipatec.local}
hipatec.frontend-origin=${HIPATEC_FRONTEND_ORIGIN:http://localhost:8100}
hipatec.recuperacao-senha.url=${HIPATEC_RESET_URL:http://localhost:8100/redefinir-senha}
hipatec.mail.provider=${HIPATEC_MAIL_PROVIDER:smtp}

# OneSignal
hipatec.onesignal.app-id=${ONESIGNAL_APP_ID:}
hipatec.onesignal.api-key=${ONESIGNAL_API_KEY:}

# Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Porta: Railway utiliza PORT; local utiliza SERVER_PORT
server.port=${PORT:${SERVER_PORT:8080}}


server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true