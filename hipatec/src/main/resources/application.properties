spring.application.name=hipatec

# Banco de dados PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload de arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Configuração de e-mail
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hipatec.mail.from=${HIPATEC_MAIL_FROM:nao-responda@hipatec.local}
hipatec.frontend-origin=${HIPATEC_FRONTEND_ORIGIN:http://localhost:8100}
hipatec.recuperacao-senha.url=${HIPATEC_RESET_URL:http://localhost:8100/redefinir-senha}

# Provedor de e-mail
hipatec.mail.provider=${HIPATEC_MAIL_PROVIDER:smtp}
hipatec.onesignal.app-id=${ONESIGNAL_APP_ID:}
hipatec.onesignal.api-key=${ONESIGNAL_API_KEY:}

# Sessão
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HIPATEC_SESSION_SECURE:true}
server.servlet.session.tracking-modes=cookie

# Porta do Railway
server.port=${PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true