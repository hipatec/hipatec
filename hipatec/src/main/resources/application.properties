
spring.application.name=hipatec
spring.config.import=optional:file:./.env[.properties]

# Banco de dados SQL Server
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Upload de arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Configuração de e-mail SMTP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# E-mail do Hipatec
hipatec.mail.from=${HIPATEC_MAIL_FROM:nao-responda@hipatec.local}
hipatec.frontend-origin=${HIPATEC_FRONTEND_ORIGIN:http://localhost:8100}
hipatec.recuperacao-senha.url=${HIPATEC_RESET_URL:http://localhost:8100/redefinir-senha}

# Provedor de e-mail
hipatec.mail.provider=${HIPATEC_MAIL_PROVIDER:smtp}
hipatec.onesignal.app-id=${ONESIGNAL_APP_ID:}
hipatec.onesignal.api-key=${ONESIGNAL_API_KEY:}

# Servidor
server.port=${SERVER_PORT:8080}
