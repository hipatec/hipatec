server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:mem:recuperacao-local;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.data.redis.repositories.enabled=false
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
hipatec.mail.provider=smtp
hipatec.mail.from=nao-responda@hipatec.local
hipatec.frontend-origin=http://localhost:8100
hipatec.recuperacao-senha.url=http://localhost:8100/redefinir-senha
